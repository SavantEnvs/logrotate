create

"/tmp/lrt/d\[ab\]/test.log" {
    daily
    dateext
    dateformat -%Y%m%d
    rotate 1
    nocompress
}

"/tmp/lrt/test\[abc\].log" {
    daily
    dateext
    dateformat -%Y%m%d
    rotate 5
    compress
    delaycompress
}

"/tmp/lrt/test\[xyz\].log" {
    daily
    rotate -1
    nocompress
}
